<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="svareignadmin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>svareignadmin</title>
  <link rel="manifest" href="manifest.json">

  <!-- ⭐ GOOGLE MAPS PLACES SDK -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDqpOdQdfhCp5iv-2TdmOCYJwEI0K_O8IY&libraries=places"
    defer>
    </script>

  <!-- ⭐ CUSTOM JS FUNCTIONS FOR FLUTTER -->
  <script>
    let autocompleteService;
    let placesService;
    let dummyMapDiv;

    function initGoogleServices() {
      // Create dummy div for PlacesService
      dummyMapDiv = document.createElement("div");
      dummyMapDiv.style.height = "0px";
      document.body.appendChild(dummyMapDiv);

      autocompleteService = new google.maps.places.AutocompleteService();
      placesService = new google.maps.places.PlacesService(dummyMapDiv);
    }

    // Called from Flutter to get suggestions
    function getPlaceSuggestions(input, callbackName) {
      if (!autocompleteService) return;

      autocompleteService.getPlacePredictions(
        { input: input, componentRestrictions: { country: "in" } },
        (predictions, status) => {
          if (status === google.maps.places.PlacesServiceStatus.OK) {
            window[callbackName](JSON.stringify(predictions));
          } else {
            window[callbackName]("[]");
          }
        }
      );
    }

    // Called from Flutter to get place details
    function getPlaceDetails(placeId, callbackName) {
      if (!placesService) return;

      placesService.getDetails(
        { placeId: placeId },
        (result, status) => {
          if (status === google.maps.places.PlacesServiceStatus.OK) {
            window[callbackName](JSON.stringify(result));
          } else {
            window[callbackName]("{}");
          }
        }
      );
    }

    // Wait for Google SDK to load
    window.addEventListener("load", () => {
      const checkInterval = setInterval(() => {
        if (window.google && window.google.maps) {
          initGoogleServices();
          clearInterval(checkInterval);
        }
      }, 300);
    });
  </script>

</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
